<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b323b" />
      <stop offset="65%" stop-color="#264653" />
      <stop offset="100%" stop-color="#142329" />
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd166" />
      <stop offset="100%" stop-color="#f4a261" />
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a373" />
      <stop offset="100%" stop-color="#9e6d43" />
    </linearGradient>
  </defs>

  <!-- Base background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)" />

  <!-- Subtle outer gold arch rim -->
  <path
    d="M84 440 V232 C84 134 160 66 256 66 C352 66 428 134 428 232 V440"
    fill="none"
    stroke="#ffd166"
    stroke-opacity="0.35"
    stroke-width="14"
    stroke-linecap="round"
  />

  <!-- Golden-hour temple sun disc -->
  <circle cx="256" cy="212" r="106" fill="url(#sun)" />

  <!-- Perspective sandstone causeway -->
  <polygon points="222,272 290,272 418,452 94,452" fill="url(#path)" />
  <polygon points="244,272 268,272 308,452 204,452" fill="#e2ba8f" fill-opacity="0.45" />

  <!-- Ruin side columns silhouette -->
  <rect x="114" y="216" width="28" height="178" rx="4" fill="#182930" />
  <rect x="370" y="216" width="28" height="178" rx="4" fill="#182930" />

  <!-- Stylized runner / Naira emblem inside sun -->
  <circle cx="256" cy="206" r="46" fill="#1b323b" stroke="#fff4e2" stroke-width="5" />
  <text
    x="256"
    y="224"
    text-anchor="middle"
    fill="#ffd166"
    font-size="58"
    font-weight="700"
    font-family="Georgia, serif"
  >₦</text>
</svg>
